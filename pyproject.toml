[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turntable-studio"
version = "0.0.1"
description = "Turn a prompt or picture into a 3D character and a scroll-driven 360-degree turntable page."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kunal Pidiha" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-playwright>=0.5",
    "pillow>=10.1",
    "ruff>=0.6",
]

[project.scripts]
turntable = "turntable.cli:app"

[tool.setuptools.packages.find]
include = ["turntable*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# typer.Argument()/typer.Option() as parameter defaults is Typer's own idiom.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Comes from the pytest-base-url plugin (installed with pytest-playwright), not this project.
    "ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning",
]
